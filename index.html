<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Klondike Solitaire</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="game-container">
        <header id="top-bar">
            <div id="controls">
                <button id="new-game">New Game</button>
                <button id="undo">Undo</button>
                <button id="hint">Hint</button>
            </div>
            <div id="stats">
                <div id="score">Score: 0</div>
                <div id="moves">Moves: 0</div>
                <div id="time">Time: 00:00</div>
            </div>
        </header>

        <main id="game-board">
            <div class="top-row">
                <div class="stock-waste-container">
                    <div id="stock" class="pile-placeholder"></div>
                    <div id="waste" class="pile"></div>
                </div>
                <div id="foundations" class="piles-container">
                    <div class="pile-placeholder foundation" data-suit="hearts"></div>
                    <div class="pile-placeholder foundation" data-suit="diamonds"></div>
                    <div class="pile-placeholder foundation" data-suit="clubs"></div>
                    <div class="pile-placeholder foundation" data-suit="spades"></div>
                </div>
            </div>
            <div id="tableau" class="piles-container">
                <div class="pile tableau-pile"></div>
                <div class="pile tableau-pile"></div>
                <div class="pile tableau-pile"></div>
                <div class="pile tableau-pile"></div>
                <div class="pile tableau-pile"></div>
                <div class="pile tableau-pile"></div>
                <div class="pile tableau-pile"></div>
            </div>
        </main>
    </div>

    <div id="win-screen" class="hidden">
        <div class="win-content">
            <h2>You Win!</h2>
            <p id="win-stats"></p>
            <button id="win-new-game">Play Again</button>
        </div>
    </div>

    <script type="module" src="main.js"></script>

</body>
</html>
